openapi: 3.0.3
info:
  title: API Activos y Órdenes
  version: 0.6.0
  description: |
    API REST en capas (Express + Node) sobre un recorte **hipotético** de un sistema de inversiones en CEDEARs.
    Un **Activo** es un CEDEAR seguido por el sistema (nivel de seguimiento, cantidad en cartera y tope permitido).
    Una **Orden** es una intención de compra o venta sobre un activo, armada para colocarla a mano en el broker.
    Relación **Activo 1 : N Orden** (cada orden tiene su `activoId`). Las reglas de negocio viven en los casos de uso
    y responden 404 o 409 con un código propio (ver cada endpoint).

    Una **Etiqueta** es un rótulo libre para agrupar activos (`dividendos`, `defensivo`). Relación **Activo N : N Etiqueta**
    a través de la tabla intermedia `activo_etiquetas`: cada vínculo se crea y se borra como subrecurso
    (`/activos/{id}/etiquetas/{etiquetaId}`), todo activo trae sus etiquetas anidadas y `GET /activos?etiqueta=` filtra
    por el nombre de una. Borrar una etiqueta la saca de todos los activos; borrar un activo se lleva sus vínculos.

    Todos los errores tienen la forma `{ "error": { "code", "message", "details?" } }`.
    La persistencia (`memory` | `sequelize`) se elige por variable de entorno y no cambia las respuestas.

    **Eventos de dominio** (no cambian ninguna respuesta: son avisos que salen después de guardar). Crear una orden
    emite `orden.creada`, que imprime la «tabla para colocar a mano» por consola o la agrega al archivo
    (`NOTIFIER_TYPE`). Crear una compra, o editar su cantidad, emite `activo.topeCerca` cuando cartera + compras
    vivas llega al `TOPE_CERCA_PCT` % del tope; ese aviso sale siempre por dos canales: archivo (`NOTIFICATIONS_LOG_PATH`) y consola.
    Editar la `cantidad` o el `topeCedears` de un activo emite el mismo aviso. Ejecutar una orden emite `orden.ejecutada`
    (por el canal de `NOTIFIER_TYPE`), con la cartera antes y después. Si un aviso falla, la operación responde igual.

    **Transacciones.** Las operaciones que leen, verifican reglas y escriben (alta, edición, borrado y ejecución de
    órdenes; alta, edición y borrado de activos; asignar y quitar etiquetas; borrar una etiqueta) corren en una
    transacción: con pedidos simultáneos, las reglas se cumplen igual en los dos modos de persistencia. Dos son
    operaciones atómicas de varias escrituras: la ejecución (`POST /ordenes/{id}/ejecucion`) marca la orden y mueve la
    cartera juntas, y el alta de un activo con `etiquetaIds` crea el activo y sus vínculos juntos; si algo falla, no
    queda nada.

servers:
  - url: /
    description: Este mismo servidor (mismo host y puerto que esta página)

tags:
  - name: Activos
    description: CEDEARs seguidos por el sistema
  - name: Órdenes
    description: Órdenes de compra o venta sobre un activo (nacen vivas; una ejecutada es historial)
  - name: Etiquetas
    description: Rótulos para agrupar activos (relación N:N con la tabla intermedia activo_etiquetas)

paths:
  /activos:
    get:
      tags: [Activos]
      summary: Listar activos (filtros, orden y paginación)
      operationId: listarActivos
      parameters:
        - name: nivel
          in: query
          description: Filtra por nivel de seguimiento
          schema:
            $ref: "#/components/schemas/Nivel"
        - name: mercado
          in: query
          description: Filtra por mercado
          schema:
            $ref: "#/components/schemas/Mercado"
        - name: etiqueta
          in: query
          description: |
            Filtra por el nombre de una etiqueta (la N:N recorrida desde la etiqueta). Se normaliza como en el alta:
            `Dividendos` = `dividendos`. Cada activo encontrado trae **todas** sus etiquetas, no solo la buscada.
            Una etiqueta que no existe no es un error: total 0.
          schema:
            type: string
            pattern: '^[a-z][a-z0-9-]{1,29}$'
            example: dividendos
        - name: sort
          in: query
          description: Campo de orden; con `-` adelante, descendente
          schema:
            type: string
            pattern: '^-?(id|ticker|nombre|mercado|ratio|nivel|cantidad|topeCedears)$'
            example: -cantidad
        - name: page
          in: query
          description: Número de página (desde 1)
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          description: Tamaño de página (máximo 100)
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Página de activos con metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListadoActivos"
              example:
                page: 1
                limit: 20
                total: 3
                data:
                  - { id: 1, ticker: KO, nombre: Coca-Cola, mercado: NYSE, ratio: 5, nivel: L3, cantidad: 40, topeCedears: 100, etiquetas: [{ id: 1, nombre: dividendos }, { id: 3, nombre: defensivo }] }
                  - { id: 2, ticker: AAPL, nombre: Apple, mercado: NASDAQ, ratio: 20, nivel: L2, cantidad: 0, topeCedears: 30, etiquetas: [{ id: 2, nombre: tecnologia }] }
                  - { id: 3, ticker: GGAL, nombre: Grupo Financiero Galicia, mercado: BYMA, ratio: 1, nivel: L1, cantidad: 0, topeCedears: 50, etiquetas: [{ id: 4, nombre: argentina }] }
        "400":
          $ref: "#/components/responses/ErrorValidacion"
    post:
      tags: [Activos]
      summary: Dar de alta un activo, opcionalmente con sus etiquetas
      description: |
        Con `etiquetaIds`, es la **operación atómica de la N:N**: el activo y sus vínculos se escriben en una transacción.
        Reglas, en este orden: **2** ticker único (409) · todas las etiquetas tienen que existir (404, con las que faltan en
        `details`). Si algo falla, el activo no queda creado.
      operationId: crearActivo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActivoCreate"
            examples:
              completo:
                summary: Alta completa
                value: { ticker: MSFT, nombre: Microsoft, mercado: NASDAQ, ratio: 30, nivel: L2, cantidad: 0, topeCedears: 60 }
              sinCantidad:
                summary: Sin cantidad (toma 0 por defecto)
                value: { ticker: PBR, nombre: Petrobras, mercado: NYSE, ratio: 2, nivel: L1, topeCedears: 80 }
              conEtiquetas:
                summary: Con etiquetas (operación atómica)
                value: { ticker: PG, nombre: Procter & Gamble, mercado: NYSE, ratio: 15, nivel: L1, topeCedears: 20, etiquetaIds: [1, 3] }
              etiquetaInexistente:
                summary: Con una etiqueta que no existe → 404 y no se crea nada
                value: { ticker: JNJ, nombre: Johnson & Johnson, mercado: NYSE, ratio: 15, nivel: L1, topeCedears: 20, etiquetaIds: [3, 999] }
      responses:
        "201":
          description: Activo creado, con sus etiquetas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Activo"
              examples:
                sinEtiquetas:
                  summary: Sin etiquetaIds
                  value: { id: 4, ticker: MSFT, nombre: Microsoft, mercado: NASDAQ, ratio: 30, nivel: L2, cantidad: 0, topeCedears: 60, etiquetas: [] }
                conEtiquetas:
                  summary: Con etiquetaIds [1, 3]
                  value: { id: 4, ticker: PG, nombre: Procter & Gamble, mercado: NYSE, ratio: 15, nivel: L1, cantidad: 0, topeCedears: 20, etiquetas: [{ id: 1, nombre: dividendos }, { id: 3, nombre: defensivo }] }
        "400":
          $ref: "#/components/responses/ErrorValidacion"
        "404":
          description: Alguna de las etiquetas no existe; el activo no se creó
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: ETIQUETA_NO_ENCONTRADA
                  message: "No existe(n) la(s) etiqueta(s) 998, 999: el activo no se creó"
                  details:
                    - { field: etiquetaIds, message: No existe una etiqueta con id 998 }
                    - { field: etiquetaIds, message: No existe una etiqueta con id 999 }
        "409":
          description: Ya existe un activo con ese ticker (regla de negocio 2)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: { code: TICKER_DUPLICADO, message: Ya existe un activo con el ticker KO }

  /activos/{id}:
    parameters:
      - $ref: "#/components/parameters/ActivoId"
    get:
      tags: [Activos]
      summary: Obtener un activo por id
      operationId: obtenerActivo
      responses:
        "200":
          description: Activo encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Activo"
              example: { id: 1, ticker: KO, nombre: Coca-Cola, mercado: NYSE, ratio: 5, nivel: L3, cantidad: 40, topeCedears: 100, etiquetas: [{ id: 1, nombre: dividendos }, { id: 3, nombre: defensivo }] }
        "400":
          $ref: "#/components/responses/ErrorValidacion"
        "404":
          $ref: "#/components/responses/ActivoNoEncontrado"
    put:
      tags: [Activos]
      summary: Modificar parcialmente un activo
      description: |
        Solo se pisan los campos enviados. Hay que enviar al menos uno. Reglas: **2** el ticker no puede ser el de otro
        activo · **5 y 6 vistas desde el activo** si cambia `cantidad` o `topeCedears`, lo comprometido en órdenes vivas
        tiene que seguir entrando (la cartera cubre las ventas vivas; cartera + compras vivas ≤ tope).
        Si el cambio toca `cantidad` o `topeCedears` y lo comprometido llega a `TOPE_CERCA_PCT` % del tope, emite `activo.topeCerca`.
        Las etiquetas no se cambian acá, sino con `POST`/`DELETE /activos/{id}/etiquetas/{etiquetaId}`.
      operationId: actualizarActivo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActivoUpdate"
            examples:
              subirNivel:
                summary: Pasar a lista de compra
                value: { nivel: L2 }
              ajustarPosicion:
                summary: Ajustar cantidad y tope
                value: { cantidad: 45, topeCedears: 120 }
      responses:
        "200":
          description: Activo actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Activo"
              example: { id: 3, ticker: GGAL, nombre: Grupo Financiero Galicia, mercado: BYMA, ratio: 1, nivel: L2, cantidad: 0, topeCedears: 50, etiquetas: [{ id: 4, nombre: argentina }] }
        "400":
          $ref: "#/components/responses/ErrorValidacion"
        "404":
          $ref: "#/components/responses/ActivoNoEncontrado"
        "409":
          description: Una regla de negocio impide el cambio (regla 2, o reglas 5 y 6 vistas desde el activo)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                tickerDuplicado:
                  summary: Regla 2
                  value: { error: { code: TICKER_DUPLICADO, message: Ya existe otro activo con el ticker KO } }
                cantidadInsuficiente:
                  summary: Regla 5 — la cartera no cubre las ventas vivas
                  value: { error: { code: CANTIDAD_INSUFICIENTE, "message": "AAPL no puede quedar con 4 en cartera: hay 5 comprometidos en ventas vivas" } }
                topeExcedido:
                  summary: Regla 6 — lo comprometido supera el tope nuevo
                  value: { error: { code: TOPE_EXCEDIDO, "message": "AAPL no puede quedar con tope 25: ya hay 30 comprometidos (10 en cartera + 20 en compras vivas)" } }
    delete:
      tags: [Activos]
      summary: Eliminar un activo
      description: Solo si no tiene órdenes, ni vivas ni ejecutadas (regla 8). Se lleva sus vínculos con etiquetas.
      operationId: eliminarActivo
      responses:
        "204":
          description: Eliminado (sin cuerpo)
        "400":
          $ref: "#/components/responses/ErrorValidacion"
        "404":
          $ref: "#/components/responses/ActivoNoEncontrado"
        "409":
          description: El activo tiene órdenes asociadas (regla de negocio 8)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: { code: ACTIVO_CON_ORDENES, "message": "No se puede eliminar el activo 1: tiene 2 orden(es) asociada(s)" }

  /activos/{id}/ordenes:
    parameters:
      - $ref: "#/components/parameters/ActivoId"
    get:
      tags: [Activos, Órdenes]
      summary: Listar las órdenes de un activo (la relación 1:N)
      operationId: listarOrdenesDeActivo
      parameters:
        - $ref: "#/components/parameters/FiltroEstado"
        - $ref: "#/components/parameters/FiltroSentido"
        - $ref: "#/components/parameters/OrdenSort"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Página de órdenes del activo con metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListadoOrdenes"
              example:
                page: 1
                limit: 20
                total: 2
                data:
                  - { id: 1, activoId: 1, sentido: venta, cantidad: 10, precioLimite: 70, validaHasta: "2026-11-30", estado: viva, motivo: Toma parcial de ganancia, activo: { id: 1, ticker: KO } }
                  - { id: 2, activoId: 1, sentido: compra, cantidad: 40, precioLimite: 55, validaHasta: "2026-10-20", estado: ejecutada, motivo: Armado de la posición, activo: { id: 1, ticker: KO } }
        "400":
          $ref: "#/components/responses/ErrorValidacion"
        "404":
          $ref: "#/components/responses/ActivoNoEncontrado"

  /activos/{id}/etiquetas:
    parameters:
      - $ref: "#/components/parameters/ActivoId"
    get:
      tags: [Activos, Etiquetas]
      summary: Listar las etiquetas de un activo (la relación N:N)
      description: Ordenadas por id. Un activo tiene pocas, así que no se pagina.
      operationId: listarEtiquetasDeActivo
      responses:
        "200":
          description: Etiquetas del activo (lista vacía si no tiene)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListaEtiquetas"
              example: [{ id: 1, nombre: dividendos }, { id: 3, nombre: defensivo }]
        "400":
          $ref: "#/components/responses/ErrorValidacion"
        "404":
          $ref: "#/components/responses/ActivoNoEncontrado"

  /activos/{id}/etiquetas/{etiquetaId}:
    parameters:
      - $ref: "#/components/parameters/ActivoId"
      - $ref: "#/components/parameters/EtiquetaIdVinculo"
    post:
      tags: [Activos, Etiquetas]
      summary: Asignarle una etiqueta a un activo (crear el vínculo)
      description: Sin body. En una transacción; dos asignaciones simultáneas iguales dan 201 y 409, en los dos modos.
      operationId: asignarEtiqueta
      responses:
        "201":
          description: Vínculo creado; devuelve las etiquetas del activo después del cambio
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListaEtiquetas"
              example: [{ id: 1, nombre: dividendos }, { id: 2, nombre: tecnologia }]
        "400":
          $ref: "#/components/responses/ErrorValidacion"
        "404":
          description: No existe el activo o la etiqueta
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                activo:
                  summary: El activo no existe
                  value: { error: { code: ACTIVO_NO_ENCONTRADO, message: No existe un activo con id 999 } }
                etiqueta:
                  summary: La etiqueta no existe
                  value: { error: { code: ETIQUETA_NO_ENCONTRADA, message: No existe una etiqueta con id 999 } }
        "409":
          description: El activo ya tiene esa etiqueta
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: { code: ETIQUETA_YA_ASIGNADA, message: El activo AAPL ya tiene la etiqueta dividendos }
    delete:
      tags: [Activos, Etiquetas]
      summary: Quitarle una etiqueta a un activo (borrar el vínculo)
      description: La etiqueta sigue existiendo; solo se borra el vínculo.
      operationId: quitarEtiqueta
      responses:
        "204":
          description: Vínculo borrado (sin cuerpo)
        "400":
          $ref: "#/components/responses/ErrorValidacion"
        "404":
          description: No existe el activo, la etiqueta, o el vínculo entre los dos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                activo:
                  summary: El activo no existe
                  value: { error: { code: ACTIVO_NO_ENCONTRADO, message: No existe un activo con id 999 } }
                etiqueta:
                  summary: La etiqueta no existe
                  value: { error: { code: ETIQUETA_NO_ENCONTRADA, message: No existe una etiqueta con id 999 } }
                vinculo:
                  summary: El activo no tiene esa etiqueta
                  value: { error: { code: ETIQUETA_NO_ASIGNADA, message: El activo AAPL no tiene la etiqueta dividendos } }

  /ordenes:
    get:
      tags: [Órdenes]
      summary: Listar órdenes (filtros, orden y paginación)
      operationId: listarOrdenes
      parameters:
        - $ref: "#/components/parameters/FiltroEstado"
        - $ref: "#/components/parameters/FiltroSentido"
        - name: activoId
          in: query
          description: Filtra por activo
          schema:
            type: integer
            minimum: 1
        - $ref: "#/components/parameters/OrdenSort"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Página de órdenes con metadata; cada orden trae el resumen de su activo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListadoOrdenes"
              example:
                page: 1
                limit: 20
                total: 3
                data:
                  - { id: 1, activoId: 1, sentido: venta, cantidad: 10, precioLimite: 70, validaHasta: "2026-11-30", estado: viva, motivo: Toma parcial de ganancia, activo: { id: 1, ticker: KO } }
                  - { id: 2, activoId: 1, sentido: compra, cantidad: 40, precioLimite: 55, validaHasta: "2026-10-20", estado: ejecutada, motivo: Armado de la posición, activo: { id: 1, ticker: KO } }
                  - { id: 3, activoId: 2, sentido: compra, cantidad: 10, precioLimite: 12.5, validaHasta: "2026-11-27", estado: viva, motivo: null, activo: { id: 2, ticker: AAPL } }
        "400":
          $ref: "#/components/responses/ErrorValidacion"
    post:
      tags: [Órdenes]
      summary: Armar una orden (nace viva)
      description: |
        Reglas de negocio, en este orden:
        **1** el activo existe (404 `ACTIVO_NO_ENCONTRADO`) ·
        **4** solo se compra en nivel L2 o L3 (409 `NIVEL_NO_OPERABLE`) ·
        **3** no hay otra orden viva con el mismo activo, sentido y precio (409 `ORDEN_DUPLICADA`) ·
        **5** venta ≤ cartera − ventas vivas (409 `CANTIDAD_INSUFICIENTE`) ·
        **6** compra: cartera + compras vivas + la nueva ≤ tope (409 `TOPE_EXCEDIDO`).
        `estado` e `id` no se envían: si vienen, se ignoran.

        Después de guardar emite `orden.creada` (tabla para colocar a mano) y, si es una compra que deja lo
        comprometido en `TOPE_CERCA_PCT` % o más del tope, `activo.topeCerca`. Un aviso que falla no cambia la respuesta.
      operationId: crearOrden
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrdenCreate"
            examples:
              compra:
                summary: Compra de AAPL (nivel L2, entra en el tope)
                value: { activoId: 2, sentido: compra, cantidad: 5, precioLimite: 12, validaHasta: "2026-12-15", motivo: Segunda tanda de compra }
              venta:
                summary: Venta de KO (hay CEDEARs disponibles)
                value: { activoId: 1, sentido: venta, cantidad: 5, precioLimite: 80, validaHasta: "2026-12-15" }
              duplicada:
                summary: Repite la orden 3 (da 409 ORDEN_DUPLICADA)
                value: { activoId: 2, sentido: compra, cantidad: 1, precioLimite: 12.5, validaHasta: "2026-12-15" }
              topeExcedido:
                summary: Supera el tope de AAPL (da 409 TOPE_EXCEDIDO)
                value: { activoId: 2, sentido: compra, cantidad: 100, precioLimite: 11, validaHasta: "2026-12-15" }
              nivelNoOperable:
                summary: Compra de GGAL en nivel L1 (da 409 NIVEL_NO_OPERABLE)
                value: { activoId: 3, sentido: compra, cantidad: 1, precioLimite: 1000, validaHasta: "2026-12-15" }
      responses:
        "201":
          description: Orden creada, en estado viva
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Orden"
              example: { id: 4, activoId: 2, sentido: compra, cantidad: 5, precioLimite: 12, validaHasta: "2026-12-15", estado: viva, motivo: Segunda tanda de compra, activo: { id: 2, ticker: AAPL } }
        "400":
          $ref: "#/components/responses/ErrorValidacion"
        "404":
          $ref: "#/components/responses/ActivoNoEncontrado"
        "409":
          description: Una regla de negocio impide crearla (reglas 3, 4, 5 o 6)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                ordenDuplicada:
                  summary: Regla 3
                  value: { error: { code: ORDEN_DUPLICADA, message: Ya existe la orden viva 3 de compra de AAPL a 12.5 } }
                nivelNoOperable:
                  summary: Regla 4
                  value: { error: { code: NIVEL_NO_OPERABLE, message: "No se puede comprar GGAL: está en nivel L1 y solo se compra en L2 o L3" } }
                cantidadInsuficiente:
                  summary: Regla 5
                  value: { error: { code: CANTIDAD_INSUFICIENTE, message: "No se pueden vender 36 KO: hay 30 disponibles (40 en cartera − 10 en ventas vivas)" } }
                topeExcedido:
                  summary: Regla 6
                  value: { error: { code: TOPE_EXCEDIDO, message: "Comprar 100 AAPL llevaría a 110 CEDEARs (0 en cartera + 10 en compras vivas + 100) y el tope es 30" } }

  /ordenes/{id}:
    parameters:
      - $ref: "#/components/parameters/OrdenId"
    get:
      tags: [Órdenes]
      summary: Obtener una orden por id
      operationId: obtenerOrden
      responses:
        "200":
          description: Orden encontrada, con el resumen de su activo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Orden"
              example: { id: 2, activoId: 1, sentido: compra, cantidad: 40, precioLimite: 55, validaHasta: "2026-10-20", estado: ejecutada, motivo: Armado de la posición, activo: { id: 1, ticker: KO } }
        "400":
          $ref: "#/components/responses/ErrorValidacion"
        "404":
          $ref: "#/components/responses/OrdenNoEncontrada"
    put:
      tags: [Órdenes]
      summary: Modificar parcialmente una orden viva
      description: |
        Solo se editan `cantidad`, `precioLimite`, `validaHasta` y `motivo` (al menos uno). `activoId` y `sentido` no:
        sería otra orden. Reglas: **7** no se modifica una orden ejecutada · **3** si cambia el precio, no duplica otra viva ·
        **5/6** si cambia la cantidad, entra en lo disponible. En 3, 5 y 6 la propia orden no se cuenta.
        Si el cambio incluye la `cantidad` de una compra y lo comprometido llega a `TOPE_CERCA_PCT` % del tope,
        emite `activo.topeCerca`; editar solo precio, fecha o motivo no avisa.
      operationId: actualizarOrden
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrdenUpdate"
            examples:
              precio:
                summary: Corregir el precio
                value: { precioLimite: 71 }
              validez:
                summary: Extender la validez y anotar el motivo
                value: { validaHasta: "2026-12-20", motivo: Sigue vigente la tesis }
      responses:
        "200":
          description: Orden actualizada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Orden"
              example: { id: 1, activoId: 1, sentido: venta, cantidad: 10, precioLimite: 71, validaHasta: "2026-11-30", estado: viva, motivo: Toma parcial de ganancia, activo: { id: 1, ticker: KO } }
        "400":
          $ref: "#/components/responses/ErrorValidacion"
        "404":
          $ref: "#/components/responses/OrdenNoEncontrada"
        "409":
          description: Una regla de negocio impide modificarla (reglas 3, 5, 6 o 7)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                ordenNoModificable:
                  summary: Regla 7
                  value: { error: { code: ORDEN_NO_MODIFICABLE, "message": "La orden 2 ya está ejecutada: no se puede modificar" } }
                ordenDuplicada:
                  summary: Regla 3
                  value: { error: { code: ORDEN_DUPLICADA, message: Ya existe la orden viva 3 de compra de AAPL a 12.5 } }
                cantidadInsuficiente:
                  summary: Regla 5
                  value: { error: { code: CANTIDAD_INSUFICIENTE, message: "No se pueden vender 46 KO: hay 40 disponibles (40 en cartera − 0 en ventas vivas)" } }
                topeExcedido:
                  summary: Regla 6
                  value: { error: { code: TOPE_EXCEDIDO, message: "Comprar 25 AAPL llevaría a 35 CEDEARs (0 en cartera + 10 en compras vivas + 25) y el tope es 30" } }
    delete:
      tags: [Órdenes]
      summary: Borrar una orden viva (es la forma de cancelarla)
      operationId: eliminarOrden
      responses:
        "204":
          description: Eliminada (sin cuerpo)
        "400":
          $ref: "#/components/responses/ErrorValidacion"
        "404":
          $ref: "#/components/responses/OrdenNoEncontrada"
        "409":
          description: La orden ya está ejecutada y es historial (regla de negocio 7)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: { code: ORDEN_NO_MODIFICABLE, "message": "La orden 2 ya está ejecutada: no se puede borrar" }

  /ordenes/{id}/ejecucion:
    parameters:
      - $ref: "#/components/parameters/OrdenId"
    post:
      tags: [Órdenes]
      summary: Ejecutar una orden viva (operación atómica)
      description: |
        Asienta que la orden se llenó en el broker, entera y a su precio límite. En **una transacción**: la orden pasa a
        `ejecutada` y la `cantidad` del activo se mueve (+ en compra, − en venta); si algo falla a mitad, no cambia nada.
        El nivel sigue a la posición: una compra deja el activo en `L3`; una venta que deja un `L3` en 0 lo pasa a `L2`.
        Reglas: **7** una orden ejecutada no se vuelve a ejecutar · **5** en una venta, lo vendido tiene que estar en cartera.
        Sin cuerpo. Emite `orden.ejecutada` después de confirmar; no emite `activo.topeCerca` (lo comprometido no sube).
      operationId: ejecutarOrden
      responses:
        "200":
          description: Orden ejecutada, con el resumen de su activo (el activo ajustado se ve con GET /activos/{id})
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Orden"
              example: { id: 3, activoId: 2, sentido: compra, cantidad: 10, precioLimite: 12.5, validaHasta: "2026-11-27", estado: ejecutada, motivo: null, activo: { id: 2, ticker: AAPL } }
        "400":
          $ref: "#/components/responses/ErrorValidacion"
        "404":
          $ref: "#/components/responses/OrdenNoEncontrada"
        "409":
          description: Una regla de negocio impide ejecutarla (reglas 7 o 5)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                ordenNoModificable:
                  summary: Regla 7 — ya estaba ejecutada
                  value: { error: { code: ORDEN_NO_MODIFICABLE, "message": "La orden 3 ya está ejecutada: no se puede volver a ejecutar" } }
                cantidadInsuficiente:
                  summary: Regla 5 — la cartera no alcanza para la venta
                  value: { error: { code: CANTIDAD_INSUFICIENTE, "message": "No se puede ejecutar la venta 6 de 5 KO: hay 3 en cartera" } }

  /etiquetas:
    get:
      tags: [Etiquetas]
      summary: Listar etiquetas (orden y paginación)
      operationId: listarEtiquetas
      parameters:
        - $ref: "#/components/parameters/EtiquetaSort"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Página de etiquetas con metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListadoEtiquetas"
              example:
                page: 1
                limit: 20
                total: 5
                data:
                  - { id: 1, nombre: dividendos }
                  - { id: 2, nombre: tecnologia }
                  - { id: 3, nombre: defensivo }
                  - { id: 4, nombre: argentina }
                  - { id: 5, nombre: energia }
        "400":
          $ref: "#/components/responses/ErrorValidacion"
    post:
      tags: [Etiquetas]
      summary: Crear una etiqueta
      description: El nombre se normaliza (sin espacios alrededor, en minúsculas) y tiene que ser único.
      operationId: crearEtiqueta
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EtiquetaCreate"
            example: { nombre: renta-fija }
      responses:
        "201":
          description: Etiqueta creada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Etiqueta"
              example: { id: 6, nombre: renta-fija }
        "400":
          $ref: "#/components/responses/ErrorValidacion"
        "409":
          $ref: "#/components/responses/EtiquetaDuplicada"

  /etiquetas/{id}:
    parameters:
      - $ref: "#/components/parameters/EtiquetaId"
    get:
      tags: [Etiquetas]
      summary: Obtener una etiqueta por id
      operationId: obtenerEtiqueta
      responses:
        "200":
          description: Etiqueta encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Etiqueta"
              example: { id: 3, nombre: defensivo }
        "400":
          $ref: "#/components/responses/ErrorValidacion"
        "404":
          $ref: "#/components/responses/EtiquetaNoEncontrada"
    put:
      tags: [Etiquetas]
      summary: Renombrar una etiqueta
      description: Como los activos la referencian por id, renombrarla la renombra en todos.
      operationId: actualizarEtiqueta
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EtiquetaUpdate"
            example: { nombre: bonos }
      responses:
        "200":
          description: Etiqueta actualizada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Etiqueta"
              example: { id: 6, nombre: bonos }
        "400":
          $ref: "#/components/responses/ErrorValidacion"
        "404":
          $ref: "#/components/responses/EtiquetaNoEncontrada"
        "409":
          $ref: "#/components/responses/EtiquetaDuplicada"
    delete:
      tags: [Etiquetas]
      summary: Eliminar una etiqueta (y sacarla de todos los activos)
      description: |
        Una etiqueta en uso se borra igual: en una transacción se quitan sus vínculos y se borra la etiqueta.
        Un vínculo es una clasificación, no historia (a diferencia de las órdenes de la regla 8).
      operationId: eliminarEtiqueta
      responses:
        "204":
          description: Eliminada (sin cuerpo)
        "400":
          $ref: "#/components/responses/ErrorValidacion"
        "404":
          $ref: "#/components/responses/EtiquetaNoEncontrada"

components:
  parameters:
    ActivoId:
      name: id
      in: path
      required: true
      description: Id del activo (entero positivo)
      schema:
        type: integer
        minimum: 1
        example: 1
    OrdenId:
      name: id
      in: path
      required: true
      description: Id de la orden (entero positivo)
      schema:
        type: integer
        minimum: 1
        example: 1
    EtiquetaId:
      name: id
      in: path
      required: true
      description: Id de la etiqueta (entero positivo)
      schema:
        type: integer
        minimum: 1
        example: 1
    EtiquetaIdVinculo:
      name: etiquetaId
      in: path
      required: true
      description: Id de la etiqueta del vínculo (entero positivo)
      schema:
        type: integer
        minimum: 1
        example: 1
    EtiquetaSort:
      name: sort
      in: query
      description: Campo de orden; con `-` adelante, descendente
      schema:
        type: string
        pattern: '^-?(id|nombre)$'
        example: nombre
    FiltroEstado:
      name: estado
      in: query
      description: Filtra por estado de la orden
      schema:
        $ref: "#/components/schemas/Estado"
    FiltroSentido:
      name: sentido
      in: query
      description: Filtra por sentido (compra o venta)
      schema:
        $ref: "#/components/schemas/Sentido"
    OrdenSort:
      name: sort
      in: query
      description: Campo de orden; con `-` adelante, descendente
      schema:
        type: string
        pattern: '^-?(id|activoId|sentido|cantidad|precioLimite|validaHasta|estado)$'
        example: -precioLimite
    Page:
      name: page
      in: query
      description: Número de página (desde 1)
      schema:
        type: integer
        minimum: 1
        default: 1
    Limit:
      name: limit
      in: query
      description: Tamaño de página (máximo 100)
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

  responses:
    ErrorValidacion:
      description: Datos de entrada inválidos (body, query o params). `details` lista cada campo con su problema.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: VALIDATION_ERROR
              message: Datos de body inválidos
              details:
                - { field: ticker, message: "El ticker debe tener entre 1 y 10 caracteres: letras mayúsculas, dígitos o punto, empezando con letra" }
                - { field: ratio, message: El ratio debe ser mayor a 0 }
    ActivoNoEncontrado:
      description: No existe un activo con ese id
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: { code: ACTIVO_NO_ENCONTRADO, message: No existe un activo con id 999 }
    OrdenNoEncontrada:
      description: No existe una orden con ese id
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: { code: ORDEN_NO_ENCONTRADA, message: No existe una orden con id 999 }

    EtiquetaNoEncontrada:
      description: No existe una etiqueta con ese id
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: { code: ETIQUETA_NO_ENCONTRADA, message: No existe una etiqueta con id 999 }
    EtiquetaDuplicada:
      description: Ya existe otra etiqueta con ese nombre
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: { code: ETIQUETA_DUPLICADA, message: Ya existe una etiqueta con el nombre dividendos }

  schemas:
    Mercado:
      type: string
      enum: [NYSE, NASDAQ, BYMA]
      description: Mercado donde cotiza el subyacente (BYMA para acciones locales)

    Nivel:
      type: string
      enum: [L0, L1, L2, L3]
      description: |
        Nivel de seguimiento: `L0`/`L1` solo seguimiento · `L2` lista para comprar · `L3` con posición en cartera

    Activo:
      type: object
      required: [id, ticker, nombre, mercado, ratio, nivel, cantidad, topeCedears, etiquetas]
      properties:
        id:
          type: integer
          description: Identificador autoincremental
          example: 1
        ticker:
          type: string
          pattern: '^[A-Z][A-Z0-9.]{0,9}$'
          description: Símbolo del CEDEAR, único
          example: KO
        nombre:
          type: string
          example: Coca-Cola
        mercado:
          $ref: "#/components/schemas/Mercado"
        ratio:
          type: number
          minimum: 0
          exclusiveMinimum: true
          description: CEDEARs por acción del subyacente (en BYMA, 1)
          example: 5
        nivel:
          $ref: "#/components/schemas/Nivel"
        cantidad:
          type: integer
          minimum: 0
          description: CEDEARs en cartera
          example: 40
        topeCedears:
          type: integer
          minimum: 1
          description: Máximo de CEDEARs permitido para este activo
          example: 100
        etiquetas:
          $ref: "#/components/schemas/ListaEtiquetas"

    ActivoCreate:
      type: object
      description: Cuerpo de `POST /activos`. El `id` lo asigna el servidor; `cantidad` toma 0 si no se envía.
      required: [ticker, nombre, mercado, ratio, nivel, topeCedears]
      properties:
        ticker:
          type: string
          pattern: '^[A-Z][A-Z0-9.]{0,9}$'
          description: Se normaliza a mayúsculas
          example: MSFT
        nombre:
          type: string
          minLength: 1
          example: Microsoft
        mercado:
          $ref: "#/components/schemas/Mercado"
        ratio:
          type: number
          minimum: 0
          exclusiveMinimum: true
          example: 30
        nivel:
          $ref: "#/components/schemas/Nivel"
        cantidad:
          type: integer
          minimum: 0
          default: 0
        topeCedears:
          type: integer
          minimum: 1
          example: 60
        etiquetaIds:
          type: array
          description: |
            Etiquetas con las que nace el activo (operación atómica: activo y vínculos, todo o nada).
            Sin repetir (si no, 400) y todas existentes (si no, 404).
          maxItems: 10
          uniqueItems: true
          items:
            type: integer
            minimum: 1
          example: [1, 3]

    ActivoUpdate:
      type: object
      description: Cuerpo de `PUT /activos/{id}`. Todos los campos son opcionales, pero debe venir al menos uno.
      minProperties: 1
      properties:
        ticker:
          type: string
          pattern: '^[A-Z][A-Z0-9.]{0,9}$'
        nombre:
          type: string
          minLength: 1
        mercado:
          $ref: "#/components/schemas/Mercado"
        ratio:
          type: number
          minimum: 0
          exclusiveMinimum: true
        nivel:
          $ref: "#/components/schemas/Nivel"
        cantidad:
          type: integer
          minimum: 0
        topeCedears:
          type: integer
          minimum: 1

    ListadoActivos:
      type: object
      description: Respuesta paginada
      required: [page, limit, total, data]
      properties:
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 20
        total:
          type: integer
          description: Cantidad de activos que cumplen los filtros (antes de paginar)
          example: 3
        data:
          type: array
          items:
            $ref: "#/components/schemas/Activo"

    Sentido:
      type: string
      enum: [compra, venta]

    Estado:
      type: string
      enum: [viva, ejecutada]
      description: Toda orden nace `viva`; `ejecutada` es historial (no se modifica ni se borra)

    ActivoResumen:
      type: object
      description: Resumen del activo de la orden, leído de la relación (no se guarda copia en la orden)
      required: [id, ticker]
      properties:
        id:
          type: integer
          example: 1
        ticker:
          type: string
          example: KO

    Orden:
      type: object
      required: [id, activoId, sentido, cantidad, precioLimite, validaHasta, estado, motivo, activo]
      properties:
        id:
          type: integer
          description: Identificador autoincremental
          example: 1
        activoId:
          type: integer
          description: Clave foránea al activo (relación Activo 1:N Orden)
          example: 1
        sentido:
          $ref: "#/components/schemas/Sentido"
        cantidad:
          type: integer
          minimum: 1
          description: CEDEARs a comprar o vender
          example: 10
        precioLimite:
          type: number
          minimum: 0
          exclusiveMinimum: true
          description: Precio límite en US$ por CEDEAR
          example: 70
        validaHasta:
          type: string
          format: date
          description: Último día de validez (AAAA-MM-DD)
          example: "2026-11-30"
        estado:
          $ref: "#/components/schemas/Estado"
        motivo:
          type: string
          nullable: true
          maxLength: 400
          example: Toma parcial de ganancia
        activo:
          $ref: "#/components/schemas/ActivoResumen"

    OrdenCreate:
      type: object
      description: Cuerpo de `POST /ordenes`. El `id` lo asigna el servidor y el `estado` siempre arranca en `viva`.
      required: [activoId, sentido, cantidad, precioLimite, validaHasta]
      properties:
        activoId:
          type: integer
          minimum: 1
          example: 2
        sentido:
          $ref: "#/components/schemas/Sentido"
        cantidad:
          type: integer
          minimum: 1
          example: 5
        precioLimite:
          type: number
          minimum: 0
          exclusiveMinimum: true
          example: 12
        validaHasta:
          type: string
          format: date
          example: "2026-12-15"
        motivo:
          type: string
          maxLength: 400
          example: Segunda tanda de compra

    OrdenUpdate:
      type: object
      description: Cuerpo de `PUT /ordenes/{id}`. Todos opcionales, pero debe venir al menos uno.
      minProperties: 1
      properties:
        cantidad:
          type: integer
          minimum: 1
        precioLimite:
          type: number
          minimum: 0
          exclusiveMinimum: true
        validaHasta:
          type: string
          format: date
        motivo:
          type: string
          maxLength: 400

    ListadoOrdenes:
      type: object
      description: Respuesta paginada
      required: [page, limit, total, data]
      properties:
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 20
        total:
          type: integer
          description: Cantidad de órdenes que cumplen los filtros (antes de paginar)
          example: 3
        data:
          type: array
          items:
            $ref: "#/components/schemas/Orden"

    Etiqueta:
      type: object
      required: [id, nombre]
      properties:
        id:
          type: integer
          description: Identificador autoincremental
          example: 1
        nombre:
          type: string
          pattern: '^[a-z][a-z0-9-]{1,29}$'
          description: Único; en minúsculas, sin tildes ni espacios
          example: dividendos

    ListaEtiquetas:
      type: array
      description: Etiquetas de un activo, ordenadas por id
      items:
        $ref: "#/components/schemas/Etiqueta"

    EtiquetaCreate:
      type: object
      description: Cuerpo de `POST /etiquetas`. El nombre se normaliza (trim y minúsculas) antes de validarlo.
      required: [nombre]
      properties:
        nombre:
          type: string
          pattern: '^[a-z][a-z0-9-]{1,29}$'
          example: renta-fija

    EtiquetaUpdate:
      type: object
      description: Cuerpo de `PUT /etiquetas/{id}`. Debe venir al menos un campo.
      minProperties: 1
      properties:
        nombre:
          type: string
          pattern: '^[a-z][a-z0-9-]{1,29}$'
          example: bonos

    ListadoEtiquetas:
      type: object
      description: Respuesta paginada
      required: [page, limit, total, data]
      properties:
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 20
        total:
          type: integer
          example: 5
        data:
          type: array
          items:
            $ref: "#/components/schemas/Etiqueta"

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: Código estable para que el cliente decida qué hacer
              example: ACTIVO_NO_ENCONTRADO
            message:
              type: string
              description: Texto para humanos
              example: No existe un activo con id 999
            details:
              type: array
              description: |
                En errores de validación, un ítem por campo inválido. En el alta de un activo con etiquetas que no
                existen (404), un ítem por etiqueta faltante.
              items:
                type: object
                properties:
                  field:
                    type: string
                    example: ratio
                  message:
                    type: string
                    example: El ratio debe ser mayor a 0
